{% extends "base.html" %}
{% load static %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px;">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="d-inline-flex align-items-center justify-content-center rounded-3 bg-primary text-white fw-bold mb-2" style="width:48px;height:48px;">FT</span>
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-muted small mb-0">Sign in to your FinTrack account</p>
      </div>
      <div id="loginError" class="alert alert-danger d-none small"></div>
      <form id="loginForm" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" class="form-control form-control-lg" id="loginEmail" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-group input-group-lg">
            <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
            <button class="btn btn-outline-secondary" type="button" id="togglePw" tabindex="-1"><i class="bi bi-eye" id="togglePwIcon"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">Sign in</button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">
        No account? <a href="{% url 'web-register' %}">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
<script>document.addEventListener("DOMContentLoaded", () => initLogin());</script>
{% endblock %}
